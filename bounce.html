<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bounce</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Courier New', monospace;
    background: #fff;
    color: #000;
    margin: 40px;
    font-size: 14px;
    line-height: 1.6;
  }

  .wrap { max-width: 640px; }

  h1 {
    font-size: 14px;
    font-weight: normal;
    margin-bottom: 20px;
  }

  .field { position: relative; }

  #board {
    width: 100%;
    height: auto;
    display: block;
    touch-action: none;
    border: 1px solid #000;
    background: #fff;
    cursor: crosshair;
  }

  #msg {
    position: absolute;
    left: 0;
    right: 0;
    top: 48%;
    text-align: center;
    display: none;
    pointer-events: none;
  }

  .controls { margin-top: 12px; }

  button {
    background: none;
    border: none;
    color: #000;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    margin-right: 16px;
  }
  button:hover {
    background: #000;
    color: #fff;
  }
  button:focus-visible { outline: 1px solid #000; outline-offset: 2px; }

  #status { color: #000; }

  .filter { margin-top: 10px; }

  /* identical to the tempo slider in life.html: a hairline track and a
     square handle, so the one non-text control on the site reads the
     same way in both pieces */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    background: none;
    width: 300px;
    height: 14px;
    vertical-align: middle;
    cursor: pointer;
    margin: 0;
  }
  input[type=range]:focus { outline: none; }
  input[type=range]:focus-visible { outline: 1px solid #000; outline-offset: 3px; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 1px; background: #000;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 9px; height: 13px; background: #000; border: 0; border-radius: 0;
    margin-top: -6px;
  }
  input[type=range]::-moz-range-track { height: 1px; background: #000; }
  input[type=range]::-moz-range-thumb {
    width: 9px; height: 13px; background: #000; border: 0; border-radius: 0;
  }
  .filter span { margin-left: 14px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>bounce</h1>

  <div class="field">
    <canvas id="board" aria-label="bounce: move the paddle with the pointer or the arrow keys, clear the bricks"></canvas>
    <div id="msg"></div>
  </div>

  <div class="controls">
    <button id="primary" onclick="primary()">start</button><button onclick="resetGame()">reset</button><button id="snd" onclick="toggleSound()">mute</button><span id="status">score 0 &middot; lives 3</span>
  </div>

  <div class="filter">
    <input id="filt" type="range" min="-100" max="100" step="1" value="0"
           aria-label="filter: lowpass to the left, highpass to the right, centre is off"
           oninput="setFilter(this.value)">
    <span id="filtv">no filter</span>
  </div>

</div>

<script>
/* ---------------------------------------------------------------
   Logical field is 800 x 600. The canvas is drawn at devicePixel
   ratio and scaled by CSS, so every constant below is in logical
   units and independent of the display size.
   --------------------------------------------------------------- */

var W = 800, H = 600;

var COLS = 10, ROWS = 7;
var CELL_W = 72, CELL_H = 28;        /* 10 * 72 = 720, centred in 800 */
var GRID_X = 40, GRID_Y = 64;
var INSET = 3;                        /* brick is 66 x 22, 6px gutters */

var BALL_R = 8;
var PADDLE_W = 100, PADDLE_H = 12, PADDLE_Y = 548;

var BASE_SPEED = 380;                 /* logical units per second */
var MAX_SPEED = 620;
var SPEED_PER_BRICK = 3;
var MAX_BOUNCE = 60 * Math.PI / 180;  /* widest deflection off the paddle */
var SERVE_SPREAD = 25 * Math.PI / 180;
var PADDLE_KEY_SPEED = 900;

/* Sub-step cap. Must stay below both the brick height (22) and the
   paddle height (12) or a fast ball can pass through them between
   frames. At MAX_SPEED and 60fps the ball travels 10.3 units per
   frame, so this splits into 3 steps. */
var MAX_STEP = 5;

var SERVE_DELAY = 0.9;                /* seconds the ball rests on the paddle */
var START_LIVES = 3;

/* ---------------------------------------------------------------
   SOUND

   One hang drum sample, pitch-shifted by playbackRate. Its own
   fundamental is G3, 12.8 cents sharp of equal temperament; SAMPLE_TRIM
   pulls the whole set back into tune so it can sit alongside other
   tuned material later.

   Columns 0..9 run low to high through the row's mode. Each row is a
   different mode -- but all seven are ROTATIONS OF ONE COLLECTION
   (G major), so every one of the 70 bricks draws from the same seven
   pitch classes. Any subset of the wall, in any state of destruction,
   is therefore consonant by construction rather than by taste:

     row 6  Ionian on G     G2 A2 B2 C3 D3 E3 F#3 G3 A3 B3
     row 5  Dorian on A     A2 B2 C3 D3 E3 F#3 G3 A3 B3 C4
     row 4  Phrygian on B   B2 C3 D3 E3 F#3 G3 A3 B3 C4 D4
     row 3  Lydian on C     C3 D3 E3 F#3 G3 A3 B3 C4 D4 E4
     row 2  Mixolydian on D D3 E3 F#3 G3 A3 B3 C4 D4 E4 F#4
     row 1  Aeolian on E    E3 F#3 G3 A3 B3 C4 D4 E4 F#4 G4
     row 0  Locrian on F#   F#3 G3 A3 B3 C4 D4 E4 F#4 G4 A4

   Full span G2..A4, playbackRate 0.500..2.245, geometric centre 1.06.

   For genuinely different collections instead -- more modal colour,
   but rows far apart will clash when heard together -- replace the
   `deg` line in buildBricks with a per-row interval table rooted on a
   common tonic. That trade is real; this version chooses adjacency.
   --------------------------------------------------------------- */

var AUDIO_FILE = 'hang-drum.wav';
var SAMPLE_TRIM = Math.pow(2, -12.8 / 1200);   /* sample sits 12.8c sharp */
var TONIC = -12;                               /* G2, relative to the sample's G3 */
var COLLECTION = [0, 2, 4, 5, 7, 9, 11];       /* major steps; modes are its rotations */
var MASTER_GAIN = 0.45;
var PAN_WIDTH = 0.55;                          /* 0 = mono; column maps left to right */
var HIGH_TILT_DB = -2.0;                       /* per octave, so high bells don't dominate */
var MAX_VOICES = 32;

/* ---------------------------------------------------------------
   FILTER

   One slider, -100..+100, centre off. Left closes a lowpass from the
   top, right opens a highpass from the bottom. Two BiquadFilterNodes
   sit in the master chain permanently and are parked out of band at
   the centre, so nothing is ever connected or disconnected while
   notes are ringing. Measured cost of the parked pair over all 70
   bricks: -0.007 dB. Both are 12 dB/octave at Q = 1/sqrt(2), which
   has no resonant peak, so the filter can only ever remove energy.

   The endpoints are measured against hang-drum.wav, not chosen. The
   sample is bass-heavy -- half its magnitude is below 391 Hz and 90%
   below 1162 Hz -- so the two directions are not symmetric:

     lowpass  20000 -> 140 Hz   nothing audible happens above ~1.4 kHz
     highpass 20 -> 1200 Hz     past 1200 Hz the sound stops changing
                                and only gets quieter

   Because pitch runs diagonally across the wall (row 6 col 0 is G2,
   row 0 col 9 is A4), the filter does not attenuate the wall evenly:
   at full left the bottom-left corner survives 19 dB louder than the
   top-right, and at full right that reverses. The slider therefore
   changes WHICH bricks are audible, not just how bright the whole
   thing is. That is the reason it belongs in this piece.

   TAPER. A plain exponential sweep wastes half its travel: with the
   lowpass at 10 kHz there is nothing to remove. fc = A*(B/A)^(t^p)
   with p < 1 spends the travel where the sound actually changes.
   p was chosen so that the spread across the 70 bricks grows roughly
   linearly with slider position (measured at 9 equal steps):

     lowpass  p=0.25   0.0  0.4  1.7  4.3  7.7 11.1 14.1 16.8 19.1 dB
     highpass p=0.60   0.0  0.6  3.7  8.1 12.5 16.1 18.4 19.7 20.4 dB

   MAKEUP. Without compensation the right half of the slider is a
   fader, not a filter: a 1200 Hz highpass costs 26 dB of loudness.
   FILT_*_DB below is measured, not modelled -- 16 offline renders of
   9 to 24 overlapping voices (random and contiguous brick runs) at
   each corner frequency, taking the SMALLEST makeup any render
   needed, so the filter can never push the master hotter than it
   already is at centre. Worst residual peak across all settings was
   -2.00 dBFS against -1.92 dBFS at centre, i.e. the existing gain
   staging and the limiter behaviour are unchanged.

   Note this had to be measured on the swarm, not on single notes: a
   heavily lowpassed voice is nearly a sine, and eight of them sum
   coherently. Single-note peaks said the lowpass needed 8.9 dB; the
   swarm needed 3.2.

   SLEW. The corner frequencies and the makeup gain are two halves of
   one setting, and if they separate the makeup is briefly applied to
   an open filter. Clicking the track jumps the slider instantly;
   measured overshoot in that case is +5.6 dB. Both are therefore
   driven from a single glided position that moves no faster than
   FILT_SLEW, which bounds the error at +0.54 dB.
   --------------------------------------------------------------- */

var FILT_LP_TOP = 20000;              /* parked: transparent, and above Nyquist-clamp on any real device */
var FILT_LP_BOT = 140;
var FILT_HP_BOT = 20;                 /* parked */
var FILT_HP_TOP = 1200;
var FILT_TAPER_LP = 0.25;
var FILT_TAPER_HP = 0.60;
var FILT_Q = Math.SQRT1_2;            /* 0.7071, no resonant peak */
var FILT_DEAD = 3;                    /* slider units either side that read as centre */
var FILT_SLEW = 600;                  /* slider units per second; full travel in 0.33 s */
var FILT_TICK = 20;                   /* ms, control-rate glide */
var FILT_SMOOTH = 0.010;              /* AudioParam time constant */

/* measured makeup, dB, against ascending corner frequency */
var FILT_LP_FC = [140,  165,  200,  280,  420,  700, 1400, 4000, 20000];
var FILT_LP_DB = [3.16, 2.33, 1.41, 0.45, 0.06, 0,    0,    0,    0];
var FILT_HP_FC = [20, 70, 140,  240,  380,  560,  780,   980,   1200];
var FILT_HP_DB = [0,  0,  0.85, 3.11, 5.40, 8.53, 12.74, 15.68, 18.35];

/* ---------------------------------------------------------------
   RELEASE

   The right half of the slider also shortens each note. The left
   half and the centre do not: a sample cannot be made to ring for
   longer than it was recorded, so the lowpass side keeps the natural
   decay and the constants below never apply there.

   This is not redundant with the filter. Measured decay of the
   sample to -45 dB:

     full band     1.49 s
     highpass  600 Hz   2.25 s
     highpass 1200 Hz   2.18 s

   Highpassing makes the sound decay SLOWER, not faster -- it removes
   the loud low body, and what is left is the quiet metallic tail,
   which relative to its own reduced peak rings half a second longer.
   So the highpass on its own makes the piece wash out. The release
   is what turns the right half into a dry percussive instrument
   rather than a thin sustained one.

   Each note takes its release at the moment it is struck, from the
   glided slider position, and keeps it -- moving the slider changes
   the timbre of notes already ringing (the filter is on the master)
   but not their length (the envelope is on the voice). That is the
   right split: the filter is the room, the envelope is the strike.

   LENGTH. Audible length is scaled geometrically with slider
   position, which is perceptually even because duration is judged
   logarithmically:  length = natural * REL_MIN^t.  The natural
   length is REL_T45 divided by the brick's playbackRate, so the
   "big bells ring long" property of 00-system.md section 8 survives:
   at full right the wall still runs 240 ms at the bottom-left corner
   down to 54 ms at the top-right, rather than flattening to one
   length.

     slider    0    12    25    37    50    62    75    87   100
     G2      3.00  2.22  1.60  1.18  0.85  0.63  0.45  0.33  0.24 s
     G3      1.49  1.10  0.79  0.59  0.42  0.31  0.22  0.17  0.12 s
     A4      0.67  0.49  0.36  0.26  0.19  0.14  0.10  0.07  0.05 s

   SHAPE. The sample's own decay is close to exponential -- straight
   to within 2.1 dB rms between -6 and -45 dB -- so an added
   exponential composes with it predictably, and the time constant
   that lands the compound decay on -45 dB at the target length has a
   closed form. At REL_MIN^0 = 1 that time constant is infinite,
   which is why the centre is exactly the unmodified behaviour and
   there is no step at the detent edge.

   LEVEL. Shorter notes are quieter, and most of that is wanted: at
   full right the loudness is 14 dB down, of which about 11 dB is
   simply 12.5x less duration. What should NOT drop is the strike, so
   REL_MK_DB restores the peak. It is small -- under 3 dB -- because
   the peak is the attack transient and the envelope barely touches
   it until the time constant gets very short. Measured the same way
   as the filter makeup, and applied per voice rather than on the
   master, so each note is compensated for its own envelope and a
   note still ringing from an earlier setting is not.

   Verified that the two makeups may be added: filter loss and
   envelope loss are additive in dB to within 0.5 dB over most of the
   travel, +3.3 dB at the extreme, and since both tables take the
   smallest value any render needed, the pair never over-compensates.
   Measured residual peak across the whole right travel: 0.2 to 6.0
   dB BELOW the centre peak, never above.
   --------------------------------------------------------------- */

var REL_MIN = 0.08;                   /* audible length at full right, as a fraction of natural */
var REL_T45 = 1.490;                  /* seconds to -45 dB at playbackRate 1.0, measured */
var REL_BYPASS = 0.995;               /* above this, no envelope at all */

/* measured peak makeup for the envelope alone, dB, against ascending length fraction */
var REL_MK_FRAC = [0.08, 0.11, 0.15, 0.21, 0.28, 0.39, 0.53, 0.74, 1.0];
var REL_MK_DB   = [2.94, 1.80, 1.06, 0.55, 0.28, 0.10, 0.01, 0,    0];

/* tangram palette, cool at the top to pale at the bottom */
var ROW_COLORS = [
  '#73bcc3',  /* teal */
  '#8dcfab',  /* mint green */
  '#7cc248',  /* green */
  '#fedd38',  /* yellow */
  '#f9a126',  /* orange */
  '#edc3d7',  /* pink */
  '#fcf6aa'   /* pale yellow */
];

var canvas = document.getElementById('board');
var ctx = canvas.getContext('2d');
var msgEl = document.getElementById('msg');
var statusEl = document.getElementById('status');
var primaryEl = document.getElementById('primary');
var filtEl = document.getElementById('filt');
var filtvEl = document.getElementById('filtv');

var dpr = Math.min(window.devicePixelRatio || 1, 3);
canvas.width = W * dpr;
canvas.height = H * dpr;
ctx.scale(dpr, dpr);

var bricks = [];
var paddleX = W / 2;
var ball = { x: W / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0 };
var speed = BASE_SPEED;
var score = 0, lives = START_LIVES, destroyed = 0;
var state = 'idle';                   /* idle serving playing paused over won */
var serveT = 0;
var lastTime = 0;
var keys = { left: false, right: false };
var rectCache = null;
var pointerDown = false;

/* ---------------- setup ---------------- */

function buildBricks() {
  bricks = [];
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      /* bottom row starts on degree 0, each row up starts one degree
         higher -- that rotation is what makes each row a new mode */
      var deg = (ROWS - 1 - r) + c;
      var semi = TONIC + COLLECTION[deg % 7] + 12 * Math.floor(deg / 7);
      bricks.push({
        x: GRID_X + c * CELL_W + INSET,
        y: GRID_Y + r * CELL_H + INSET,
        w: CELL_W - INSET * 2,
        h: CELL_H - INSET * 2,
        color: ROW_COLORS[r],
        points: ROWS - r,
        alive: true,
        rate: Math.pow(2, semi / 12) * SAMPLE_TRIM,
        pan: (c / (COLS - 1) * 2 - 1) * PAN_WIDTH,
        gain: Math.pow(10, (HIGH_TILT_DB * semi / 12) / 20)
      });
    }
  }
}

/* ---------------- sound ---------------- */

var actx = null, abuf = null, master = null;
var lpf = null, hpf = null, makeup = null;
var voices = 0, soundOn = true;
var filtPos = 0, filtTarget = 0;      /* slider units; filtPos glides toward filtTarget */

function initAudio() {
  if (actx) {
    if (actx.state === 'suspended') actx.resume();
    return;
  }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { actx = new AC(); } catch (e) { return; }

  master = actx.createGain();
  master.gain.value = MASTER_GAIN;

  /* master -> lowpass -> highpass -> makeup -> limiter -> out.
     The two filters are parked out of band at centre and are never
     reconnected, so moving the slider cannot click. The limiter is a
     soft limiter, not a colouring compressor -- to bypass it, connect
     makeup straight to actx.destination and delete the six lines that
     build `lim`. */
  lpf = actx.createBiquadFilter();
  lpf.type = 'lowpass';
  lpf.frequency.value = FILT_LP_TOP;
  lpf.Q.value = FILT_Q;

  hpf = actx.createBiquadFilter();
  hpf.type = 'highpass';
  hpf.frequency.value = FILT_HP_BOT;
  hpf.Q.value = FILT_Q;

  makeup = actx.createGain();
  makeup.gain.value = 1;

  var lim = actx.createDynamicsCompressor();
  lim.threshold.value = -4;
  lim.knee.value = 8;
  lim.ratio.value = 8;
  lim.attack.value = 0.005;
  lim.release.value = 0.25;

  master.connect(lpf);
  lpf.connect(hpf);
  hpf.connect(makeup);
  makeup.connect(lim);
  lim.connect(actx.destination);

  applyFilter();   /* adopt whatever the slider already reads */

  fetch(AUDIO_FILE).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.arrayBuffer();
  }).then(function (arr) {
    return new Promise(function (ok, no) {
      var p = actx.decodeAudioData(arr, ok, no);   /* callback form for old Safari */
      if (p && p.then) p.then(ok, no);             /* promise form everywhere else */
    });
  }).then(function (buf) {
    abuf = buf;
  })['catch'](function (e) {
    console.warn('bounce: no sound (' + e.message + '). Needs to be served over ' +
                 'http, not opened as a file. The game runs silently regardless.');
  });
}

/* Each hit gets its own source node and is never stopped early, so
   notes always ring out whole and overlap freely. Source nodes are
   one-shot; they are released on 'ended'. */
function playBrick(b) {
  if (!soundOn || !abuf || !actx || voices >= MAX_VOICES) return;
  if (actx.state === 'suspended') actx.resume();

  var t0 = actx.currentTime;
  var frac = relFrac(filtPos);          /* taken at the strike and kept */

  var s = actx.createBufferSource();
  s.buffer = abuf;
  s.playbackRate.value = b.rate;

  var g = actx.createGain();
  var lvl = b.gain * Math.pow(10, filtMakeupDb(frac, REL_MK_FRAC, REL_MK_DB) / 20);
  g.gain.setValueAtTime(lvl, t0);

  if (actx.createStereoPanner) {
    var p = actx.createStereoPanner();
    p.pan.value = b.pan;
    s.connect(p);
    p.connect(g);
  } else {
    s.connect(g);
  }
  g.connect(master);

  voices++;
  s.onended = function () {
    voices--;
    try { g.disconnect(); } catch (e) {}
  };
  s.start(t0);

  if (frac < REL_BYPASS) {
    /* nat = length of the sample's own decay to -45 dB at this pitch.
       tau is the added exponential that lands the compound decay on
       -45 dB at nat*frac; stop at -60 dB, which is 4/3 of that, so
       the source is released without a click. */
    var nat = REL_T45 / b.rate;
    var tau = 8.686 * nat * frac / (45 * (1 - frac));
    g.gain.setTargetAtTime(0, t0, tau);
    s.stop(t0 + Math.min(nat * frac * 4 / 3, abuf.duration / b.rate));
  }
}

/* ---------------- filter ---------------- */

/* corner frequencies for a slider position. At centre both sit at
   their parked ends and the pair is transparent. */
function filtCorners(v) {
  var t = Math.abs(v) / 100;
  var lp = FILT_LP_TOP, hp = FILT_HP_BOT;
  if (v < 0) {
    lp = FILT_LP_TOP * Math.pow(FILT_LP_BOT / FILT_LP_TOP, Math.pow(t, FILT_TAPER_LP));
  } else if (v > 0) {
    hp = FILT_HP_BOT * Math.pow(FILT_HP_TOP / FILT_HP_BOT, Math.pow(t, FILT_TAPER_HP));
  }
  return { lp: lp, hp: hp };
}

/* audible note length as a fraction of the natural one. Only the
   highpass half shortens; the lowpass half and the centre are 1. */
function relFrac(v) {
  return v > 0 ? Math.pow(REL_MIN, Math.abs(v) / 100) : 1;
}

/* Linear interpolation of a measured makeup table, in the log of the
   index. Used for both: the two filter tables are indexed by corner
   frequency, the release table by length fraction. Both of those are
   geometric in slider position, so interpolating in the log makes the
   makeup linear in slider position between measured points. */
function filtMakeupDb(fc, fcs, dbs) {
  var n = fcs.length;
  if (fc <= fcs[0]) return dbs[0];
  if (fc >= fcs[n - 1]) return dbs[n - 1];
  var x = Math.log(fc);
  for (var i = 1; i < n; i++) {
    if (fc <= fcs[i]) {
      var a = Math.log(fcs[i - 1]), b = Math.log(fcs[i]);
      var u = (x - a) / (b - a);
      return dbs[i - 1] + u * (dbs[i] - dbs[i - 1]);
    }
  }
  return dbs[n - 1];
}

/* Both corners and the makeup gain are written from the same glided
   position, so they can never disagree about which setting they are on. */
function applyFilter() {
  if (!actx || !lpf) return;
  var c = filtCorners(filtPos);
  var db = filtMakeupDb(c.lp, FILT_LP_FC, FILT_LP_DB) +
           filtMakeupDb(c.hp, FILT_HP_FC, FILT_HP_DB);
  var now = actx.currentTime;
  try {
    lpf.frequency.setTargetAtTime(c.lp, now, FILT_SMOOTH);
    hpf.frequency.setTargetAtTime(c.hp, now, FILT_SMOOTH);
    makeup.gain.setTargetAtTime(Math.pow(10, db / 20), now, FILT_SMOOTH);
  } catch (e) {
    lpf.frequency.value = c.lp;
    hpf.frequency.value = c.hp;
    makeup.gain.value = Math.pow(10, db / 20);
  }
}

function filtTick() {
  if (filtPos === filtTarget) return;
  var d = filtTarget - filtPos;
  var step = FILT_SLEW * (FILT_TICK / 1000);
  filtPos = (Math.abs(d) <= step) ? filtTarget : filtPos + (d > 0 ? step : -step);
  applyFilter();
}

function setFilter(v) {
  initAudio();
  var n = parseFloat(v);
  if (!isFinite(n)) n = 0;
  if (n < -100) n = -100;
  if (n > 100) n = 100;
  if (Math.abs(n) <= FILT_DEAD) n = 0;   /* detent, so centre is findable by hand */
  filtTarget = n;
  var c = filtCorners(n);
  filtvEl.textContent = (n === 0) ? 'no filter'
    : (n < 0 ? 'lowpass ' + Math.round(c.lp) + ' Hz'
             : 'highpass ' + Math.round(c.hp) + ' Hz');
}

function toggleSound() {
  initAudio();
  soundOn = !soundOn;
  document.getElementById('snd').textContent = soundOn ? 'mute' : 'unmute';
}

function resetGame() {
  initAudio();
  buildBricks();
  score = 0;
  lives = START_LIVES;
  destroyed = 0;
  speed = BASE_SPEED;
  paddleX = W / 2;
  dockBall();
  state = 'idle';
  hideMsg();
  updateStatus();
}

function startGame() {
  buildBricks();
  score = 0;
  lives = START_LIVES;
  destroyed = 0;
  speed = BASE_SPEED;
  hideMsg();
  updateStatus();
  dockBall();
}

function dockBall() {
  ball.x = paddleX;
  ball.y = PADDLE_Y - BALL_R - 1;
  ball.vx = 0;
  ball.vy = 0;
  serveT = SERVE_DELAY;
  state = 'serving';
  setPrimaryLabel();
}

function serve() {
  var off = (Math.random() * 2 - 1) * SERVE_SPREAD;
  ball.vx = speed * Math.sin(off);
  ball.vy = -speed * Math.cos(off);
  state = 'playing';
  setPrimaryLabel();
}

/* Rescale velocity to a new magnitude, preserving direction, so the
   ratio |vy|/speed set by the last paddle hit is never disturbed. */
function setSpeed(s) {
  var cur = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  speed = s;
  if (cur > 0) {
    ball.vx = ball.vx / cur * s;
    ball.vy = ball.vy / cur * s;
  }
}

function clampPaddle() {
  var half = PADDLE_W / 2;
  if (paddleX < half) paddleX = half;
  if (paddleX > W - half) paddleX = W - half;
}

/* ---------------- simulation ---------------- */

function update(dt) {
  if (state !== 'paused') {
    if (keys.left) paddleX -= PADDLE_KEY_SPEED * dt;
    if (keys.right) paddleX += PADDLE_KEY_SPEED * dt;
    clampPaddle();
  }

  if (state === 'idle' || state === 'over' || state === 'won') {
    if (state === 'idle') { ball.x = paddleX; ball.y = PADDLE_Y - BALL_R - 1; }
    return;
  }

  if (state === 'serving') {
    ball.x = paddleX;
    ball.y = PADDLE_Y - BALL_R - 1;
    serveT -= dt;
    if (serveT <= 0) serve();
    return;
  }

  if (state !== 'playing') return;

  var steps = Math.max(1, Math.ceil((speed * dt) / MAX_STEP));
  var sdt = dt / steps;
  for (var s = 0; s < steps; s++) {
    if (!stepBall(sdt)) break;
  }
}

/* Returns false when the step ended the rally (life lost, cleared). */
function stepBall(dt) {
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  /* side and top walls */
  if (ball.x - BALL_R < 0) {
    ball.x = BALL_R;
    ball.vx = Math.abs(ball.vx);
  } else if (ball.x + BALL_R > W) {
    ball.x = W - BALL_R;
    ball.vx = -Math.abs(ball.vx);
  }
  if (ball.y - BALL_R < 0) {
    ball.y = BALL_R;
    ball.vy = Math.abs(ball.vy);
  }

  /* bricks: circle vs axis-aligned box, resolved on the axis of
     least overlap. One brick per sub-step; a second brick hit at a
     seam is picked up by the following sub-step. */
  for (var i = 0; i < bricks.length; i++) {
    var b = bricks[i];
    if (!b.alive) continue;
    var dx = ball.x - (b.x + b.w / 2);
    var dy = ball.y - (b.y + b.h / 2);
    var ox = (b.w / 2 + BALL_R) - Math.abs(dx);
    var oy = (b.h / 2 + BALL_R) - Math.abs(dy);
    if (ox > 0 && oy > 0) {
      if (ox < oy) {
        ball.x += (dx > 0 ? ox : -ox);
        ball.vx = -ball.vx;
      } else {
        ball.y += (dy > 0 ? oy : -oy);
        ball.vy = -ball.vy;
      }
      b.alive = false;
      playBrick(b);
      destroyed++;
      score += b.points;
      setSpeed(Math.min(MAX_SPEED, BASE_SPEED + destroyed * SPEED_PER_BRICK));
      updateStatus();
      if (destroyed === bricks.length) {
        state = 'won';
        showMsg('cleared');
        setPrimaryLabel();
        return false;
      }
      break;
    }
  }

  /* paddle: deflection angle is set by where the ball lands on it,
     which is the only way the player can aim. Speed is preserved, so
     |vy| never falls below cos(60) = 0.5 of it — the ball cannot get
     trapped travelling horizontally. */
  var pdx = ball.x - paddleX;
  var pdy = ball.y - (PADDLE_Y + PADDLE_H / 2);
  var pox = (PADDLE_W / 2 + BALL_R) - Math.abs(pdx);
  var poy = (PADDLE_H / 2 + BALL_R) - Math.abs(pdy);
  if (pox > 0 && poy > 0 && ball.vy > 0) {
    var rel = pdx / (PADDLE_W / 2);
    if (rel < -1) rel = -1;
    if (rel > 1) rel = 1;
    var ang = rel * MAX_BOUNCE;
    ball.vx = speed * Math.sin(ang);
    ball.vy = -speed * Math.cos(ang);
    ball.y = PADDLE_Y - BALL_R - 0.5;
  }

  /* floor */
  if (ball.y - BALL_R > H) {
    lives--;
    updateStatus();
    if (lives <= 0) {
      state = 'over';
      showMsg('game over');
      setPrimaryLabel();
      return false;
    }
    dockBall();
    return false;
  }

  return true;
}

/* ---------------- render ---------------- */

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  ctx.lineJoin = 'miter';
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000000';
  for (var i = 0; i < bricks.length; i++) {
    var b = bricks[i];
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  }

  ctx.fillStyle = '#000000';
  ctx.fillRect(paddleX - PADDLE_W / 2, PADDLE_Y, PADDLE_W, PADDLE_H);

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
}

function frame(t) {
  if (!lastTime) lastTime = t;
  var dt = (t - lastTime) / 1000;
  lastTime = t;
  if (dt > 1 / 30) dt = 1 / 30;   /* clamp after a stall or tab switch */
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

/* ---------------- chrome ---------------- */

function updateStatus() {
  statusEl.innerHTML = 'score ' + score + ' &middot; lives ' + Math.max(0, lives);
}

function showMsg(t) { msgEl.textContent = t; msgEl.style.display = 'block'; }
function hideMsg() { msgEl.style.display = 'none'; }

function setPrimaryLabel() {
  if (state === 'paused') primaryEl.textContent = 'resume';
  else if (state === 'playing' || state === 'serving') primaryEl.textContent = 'pause';
  else primaryEl.textContent = 'start';
}

function primary() {
  initAudio();
  if (state === 'idle' || state === 'over' || state === 'won') startGame();
  else if (state === 'paused') { state = 'playing'; lastTime = 0; }
  else if (state === 'playing' || state === 'serving') state = 'paused';
  setPrimaryLabel();
}

function resumeIfPaused() {
  if (state === 'paused') { state = 'playing'; lastTime = 0; setPrimaryLabel(); }
}

/* ---------------- input ---------------- */

function rect() {
  if (!rectCache) rectCache = canvas.getBoundingClientRect();
  return rectCache;
}

function movePaddleTo(clientX) {
  var r = rect();
  if (!r.width) return;
  paddleX = (clientX - r.left) * (W / r.width);
  clampPaddle();
}

canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  initAudio();
  rectCache = canvas.getBoundingClientRect();
  pointerDown = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  movePaddleTo(e.clientX);
  if (state === 'idle' || state === 'over' || state === 'won') { startGame(); return; }
  resumeIfPaused();
});

canvas.addEventListener('pointermove', function (e) {
  if (pointerDown || e.pointerType === 'mouse') movePaddleTo(e.clientX);
});

canvas.addEventListener('pointerup', function (e) {
  pointerDown = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
});

canvas.addEventListener('pointercancel', function () { pointerDown = false; });

document.addEventListener('keydown', function (e) {
  initAudio();
  /* with the slider focused the arrow keys belong to it, not to the
     paddle -- otherwise preventDefault below eats them and the filter
     cannot be moved from the keyboard at all */
  var ae = document.activeElement;
  if (ae && ae.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
  else if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'Spacebar') {
    /* let the browser handle Space when a control has focus, or the
       button fires and this handler toggles it straight back */
    if (ae && ae.tagName === 'BUTTON') return;
    e.preventDefault();
    primary();
  }
});

document.addEventListener('keyup', function (e) {
  if (e.key === 'ArrowLeft') keys.left = false;
  else if (e.key === 'ArrowRight') keys.right = false;
});

window.addEventListener('resize', function () { rectCache = null; });
window.addEventListener('orientationchange', function () { rectCache = null; });

window.addEventListener('blur', function () { keys.left = false; keys.right = false; });

document.addEventListener('visibilitychange', function () {
  lastTime = 0;
  if (document.hidden && (state === 'playing' || state === 'serving')) {
    state = 'paused';
    setPrimaryLabel();
  }
});

/* ---------------- go ---------------- */

resetGame();
setFilter(filtEl.value);
setInterval(filtTick, FILT_TICK);
requestAnimationFrame(frame);
</script>
</body>
</html>
