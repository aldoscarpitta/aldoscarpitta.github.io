<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firenze si ascolta: chi ci apre la porta?</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0EC; --ink:#1B2326; --mute:#56656A; --track:#D5DBD7;
  --hard:#8C9A9C; --easy:#E3A72F;
  --font:"Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#151B1D;--ink:#E7ECEA;--mute:#98A6A8;--track:#2A3437;--hard:#3E4C50;--easy:#9C6E14;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#151B1D;--ink:#E7ECEA;--mute:#98A6A8;--track:#2A3437;--hard:#3E4C50;--easy:#9C6E14;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-snap-type:y mandatory;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--easy);outline-offset:-3px}
section{scroll-snap-align:start;scroll-snap-stop:always;min-height:100vh;min-height:100svh;position:relative}

/* intro */
.intro{display:flex;flex-direction:column;justify-content:center;padding:28px max(24px,8vw)}
.intro h1{font-size:clamp(40px,9vw,92px);line-height:.95;margin:0;font-weight:800;letter-spacing:-.03em}
.intro p{font-size:clamp(17px,2.4vw,22px);max-width:34ch;margin:22px 0 0;line-height:1.35}
.demo{margin:30px 0 0;height:56px;border-radius:28px;background:var(--track);position:relative;overflow:hidden;max-width:420px}
.demo i{position:absolute;inset:0 auto 0 0;width:30%;background:var(--easy);animation:demo 3.2s ease-in-out infinite alternate}
.demo>span{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:15px;font-weight:500}
@keyframes demo{from{width:12%;background:var(--hard)}to{width:88%;background:var(--easy)}}
.name{display:flex;gap:8px;margin-top:30px;max-width:420px}
.name input{flex:1;min-width:0;border:2px solid var(--ink);background:transparent;border-radius:28px;padding:12px 18px;font-size:18px}
.name button{border:0;background:var(--ink);color:var(--paper);border-radius:28px;padding:12px 22px;font-size:18px;font-weight:500;cursor:pointer}
.trial{font-size:15px!important;color:var(--mute);margin-top:18px!important}
.down{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:max(24px,8vw);color:var(--mute);font-size:15px}

/* place card */
.card{overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize;outline:none}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--hard)}
.card.unset .fill{width:0!important}
.edge{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--ink);opacity:.85}
.card.unset .edge{display:none}
.group{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink);opacity:.35}
.group b{position:absolute;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:6px;font-size:12px;font-weight:500;white-space:nowrap;opacity:1}
.inner{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:22px max(22px,7vw) calc(26px + env(safe-area-inset-bottom,0px));pointer-events:none}
.inner a{pointer-events:auto}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.card:not(.unset) .top{color:inherit;opacity:.7}
.title h2{font-size:clamp(34px,7.5vw,84px);line-height:.98;margin:0;font-weight:800;letter-spacing:-.025em;max-width:16ch;overflow-wrap:anywhere}
.title .z{font-size:clamp(16px,2.2vw,20px);margin-top:10px;font-weight:500}
.title p{font-size:clamp(15px,1.9vw,18px);max-width:46ch;line-height:1.38;margin:12px 0 0}
.title a{font-size:14px;color:inherit;display:inline-block;margin-top:10px}
.verdict{font-size:clamp(28px,5.5vw,56px);font-weight:800;letter-spacing:-.02em;line-height:1}
.verdict small{font-size:.45em;font-weight:500;margin-left:10px;letter-spacing:0}
.card.unset .verdict{color:var(--mute);font-weight:500;font-size:clamp(20px,3.4vw,30px)}
.ends{display:flex;justify-content:space-between;font-size:14px;margin-top:12px;opacity:.75}
.saved{margin-left:10px;font-size:13px;opacity:0;transition:opacity .3s}
.saved.on{opacity:.7}

/* ranking */
.rank{padding:26px max(22px,7vw) 60px}
.rank>*{max-width:760px}
.rank h2{font-size:clamp(32px,6vw,60px);margin:0;font-weight:800;letter-spacing:-.02em;line-height:1}
.rank .sub{color:var(--mute);margin:8px 0 22px;font-size:16px;max-width:52ch}
.rank ol{list-style:none;margin:0;padding:0}
.rank li button{display:grid;grid-template-columns:28px 1fr 52px;gap:10px;align-items:center;width:100%;border:0;background:none;padding:7px 0;text-align:left;cursor:pointer}
.rank .n{color:var(--mute);font-size:13px;text-align:right}
.rank .bar{position:relative;height:30px;border-radius:5px;background:var(--track);overflow:hidden}
.rank .bar i{position:absolute;inset:0 auto 0 0}
.rank .bar span{position:relative;display:block;padding:5px 9px;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .pc{font-weight:800;text-align:right}
.rank .pc small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.rank h3{font-size:17px;margin:28px 0 6px;color:var(--mute);font-weight:500}
.xl{display:inline-block;color:inherit;text-decoration:none;margin-top:30px;border:2px solid var(--ink);background:none;border-radius:28px;padding:12px 22px;font-size:17px;font-weight:500;cursor:pointer}

.count{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:5;border:0;background:var(--ink);color:var(--paper);border-radius:20px;padding:7px 13px;font-size:14px;font-weight:500;cursor:pointer}
.count[hidden]{display:none}
.note{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:20px;font-size:14px;z-index:6;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){.demo i{animation:none;width:60%}.saved{transition:none}}
</style>
</head>
<body>
<button class="count" id="count" hidden type="button" aria-label="Vai alla classifica"></button>
<main id="main">
  <section class="intro" id="intro">
    <h1>Chi ci apre la porta?</h1>
    <p>Scorri i luoghi verso il basso. Su ognuno trascina di lato: a sinistra se è difficile averlo come partner, a destra se è facile.</p>
    <div class="demo" aria-hidden="true"><i></i><span><span>difficile</span><span>facile</span></span></div>
    <form class="name" id="nameForm"><input id="nameInput" maxlength="30" placeholder="Il tuo nome" aria-label="Il tuo nome" autocomplete="name" required><button type="submit">Inizia</button></form>
    <p class="trial" id="trial" hidden>Modalità prova: i voti restano su questo dispositivo.</p>
    <div class="down">↓ scorri</div>
  </section>
</main>
<script>
"use strict";
// URL della web app Apps Script (finisce con /exec). Vuoto = modalità prova, i voti restano sul dispositivo.
const ENDPOINT = "";
const PLACES = [{"id":"0c4892721367a544","n":"Murate Idea Park","g":"Murate Idea Park","z":"Sant'Ambrogio","t":"formazione","p":"Spazi per l'innovazione nell'ex carcere delle Murate, con un auditorium dal tetto vetrato. Dove si stava chiusi oggi si progetta: che cosa trattengono i muri di una prigione?","u":"https://www.google.com/maps/place/Murate+Idea+Park/data=!4m2!3m1!1s0x132a540971bb9839:0xc4892721367a544"},{"id":"85cf76472e280027","n":"Refettorio delle ex Leopoldine","g":"Piazza Torquato Tasso, 5","z":"San Frediano","t":"civico","p":"Il refettorio del complesso delle ex Leopoldine, in piazza Tasso. Una stanza nata per mangiare insieme: il suono di una comunità che si siede alla stessa tavola.","u":"https://www.google.com/maps/place/Piazza+Torquato+Tasso,+5/data=!4m2!3m1!1s0x132a51529fa9d0eb:0x85cf76472e280027"},{"id":"5cf5421d189bcc71","n":"Conservatorio Luigi Cherubini","g":"Conservatorio di Musica Luigi Cherubini Sede Centrale","z":"San Marco","t":"formazione","p":"Il conservatorio della città, in piazza delle Belle Arti. Aule in cui la stessa frase si ripete per ore: il suono come disciplina, e quello che filtra dalle porte chiuse.","u":"https://www.google.com/maps/place/Conservatorio+di+Musica+Luigi+Cherubini+Sede+Centrale/data=!4m2!3m1!1s0x132a5404a9aa6369:0x5cf5421d189bcc71"},{"id":"26da64bbd6d8f2b3","n":"Accademia di Belle Arti","g":"Accademia di Belle Arti di Firenze","z":"San Marco","t":"formazione","p":"L'accademia nell'antico ospedale di San Matteo, accanto alla Galleria dell'Accademia. Laboratori di scultura e pittura: il suono di mani che fanno immagini.","u":"https://www.google.com/maps/place/Accademia+di+Belle+Arti+di+Firenze/data=!4m2!3m1!1s0x132a5404a86f3599:0x26da64bbd6d8f2b3"},{"id":"37955f7264926407","n":"Casa del Popolo di Settignano","g":"Casa del Popolo di Settignano - Circolo ARCI","z":"Settignano","t":"circolo","p":"Casa del popolo sulla collina di Settignano, il borgo degli scalpellini della pietra serena. La città si sente da lontano; da vicino, le voci del circolo.","u":"https://www.google.com/maps/place/Casa+del+Popolo+di+Settignano+-+Circolo+ARCI/data=!4m2!3m1!1s0x132a54c1c66227b9:0x37955f7264926407"},{"id":"5901a88a79a6b0ea","n":"CPA Firenze Sud","g":"CPA - Centro Popolare Autogestito Firenze Sud","z":"Gavinana","t":"autogestito","p":"Uno dei centri popolari autogestiti storici della città, a sud dell'Arno. Concerti, assemblee, iniziative di quartiere: il suono dell'autorganizzazione.","u":"https://www.google.com/maps/place/CPA+-+Centro+Popolare+Autogestito+Firenze+Sud/data=!4m2!3m1!1s0x132a5300446f6a13:0x5901a88a79a6b0ea"},{"id":"c65f9264eaa08fd3","n":"Cinema Flora","g":"Cinema Flora","z":"Rifredi","t":"cinema","p":"Cinema di quartiere su piazza Dalmazia, dove passa la tramvia per Careggi. La sala come riparo dal rumore della piazza.","u":"https://www.google.com/maps/place/Cinema+Flora/data=!4m2!3m1!1s0x132a56906931e045:0xc65f9264eaa08fd3"},{"id":"279f3f9171c5dd53","n":"Concretipo","g":"Concretipo","z":"Libertà","t":"indipendente","p":"Stamperia artigianale ed ecologica in via Pier Capponi. Il ritmo delle macchine da stampa e della rilegatura a mano: il lavoro come partitura.","u":"https://www.google.com/maps/place/Concretipo/data=!4m2!3m1!1s0x132a569793cee0b7:0x279f3f9171c5dd53"},{"id":"2a0592bd969689a0","n":"Artiglieria","g":"Artiglieria","z":"Fortezza","t":"indipendente","p":"Spazio di mostre, laboratori e racconti in via Cittadella, accanto alla Fortezza da Basso, con un programma rivolto ai giovani. Un luogo nuovo in una zona di passaggio.","u":"https://www.google.com/maps/place/Artiglieria/data=!4m2!3m1!1s0x132a57fead3f2de3:0x2a0592bd969689a0"},{"id":"b1eed8fddd6003d5","n":"Museo Marino Marini","g":"Museo Marino Marini Firenze","z":"Centro","t":"museo","p":"Il museo nell'ex chiesa di San Pancrazio, con la Cappella Rucellai e il tempietto di Leon Battista Alberti. Una navata piena di sculture: il riverbero di una chiesa senza liturgia.","u":"https://www.google.com/maps/place/Museo+Marino+Marini+Firenze/data=!4m2!3m1!1s0x132a56aa348d96ad:0xb1eed8fddd6003d5"},{"id":"038349b89124ab11","n":"Palazzo Strozzi","g":"Palazzo Strozzi","z":"Centro","t":"museo","p":"Il palazzo rinascimentale delle grandi mostre. Il cortile è una piazza di pietra coperta che chiunque può attraversare.","u":"https://www.google.com/maps/place/Palazzo+Strozzi/data=!4m2!3m1!1s0x132a56aa73c1b501:0x38349b89124ab11"},{"id":"f19ea7554519169c","n":"Toast Project Studio","g":"Toast Project Studio","z":"Novoli","t":"indipendente","p":"Studio per progetti e performance in piazza Morvillo, nel quartiere nuovo di Novoli. Un posto ancora poco conosciuto, in una parte di città ancora da ascoltare.","u":"https://www.google.com/maps/place/Toast+Project+Studio/data=!4m2!3m1!1s0x132a570004826c57:0xf19ea7554519169c"},{"id":"9b7f2357b8c9b677","n":"Biblioteca delle Oblate","g":"Biblioteca delle Oblate","z":"Centro","t":"biblioteca","p":"La biblioteca nell'ex convento delle Oblate, le religiose che assistevano i malati di Santa Maria Nuova. Chiostro, sale di lettura, terrazza sul Duomo: tre silenzi diversi.","u":"https://www.google.com/maps/place/Biblioteca+delle+Oblate/data=!4m2!3m1!1s0x132a5404239efca5:0x9b7f2357b8c9b677"},{"id":"04d8fa89dbe12e27","n":"IED Firenze","g":"IED Istituto Europeo di Design","z":"Firenze","t":"formazione","p":"Scuola di design, moda e comunicazione. Studenti che progettano oggetti e immagini: che posto ha il suono in una scuola di progetto?","u":"https://www.google.com/maps/place/IED+Istituto+Europeo+di+Design/data=!4m2!3m1!1s0x132a55397983f5a1:0x4d8fa89dbe12e27"},{"id":"67b49ce676d42454","n":"The Social Hub Lavagnini","g":"The Social Hub Florence Lavagnini","z":"Viali","t":"commercio","p":"Hotel e ostello con spazi comuni sui viali, tra studenti e viaggiatori. Lingue diverse, soggiorni brevi: chi abita un luogo per una settimana.","u":"https://www.google.com/maps/place/The+Social+Hub+Florence+Lavagnini/data=!4m2!3m1!1s0x132a541e08073c43:0x67b49ce676d42454"},{"id":"60de5cce83b709f2","n":"Museo Novecento","g":"Museo Novecento","z":"Santa Maria Novella","t":"museo","p":"Il museo d'arte del Novecento nell'antico Spedale delle Leopoldine, su piazza Santa Maria Novella. Un ex ospizio diventato museo.","u":"https://www.google.com/maps/place/Museo+Novecento/data=!4m2!3m1!1s0x132a56a9085e6617:0x60de5cce83b709f2"},{"id":"f12421a8cfc488fa","n":"Manifattura Tabacchi","g":"Manifattura Tabacchi Firenze","z":"Cascine","t":"indipendente","p":"L'ex fabbrica di sigari degli anni Trenta, dove lavoravano soprattutto donne, oggi distretto creativo con il programma NAM Not A Museum. Cortili enormi, capannoni, una città nella città.","u":"https://www.google.com/maps/place/Manifattura+Tabacchi+Firenze/data=!4m2!3m1!1s0x132a57315ea204ab:0xf12421a8cfc488fa"},{"id":"5fc694f64d53eea9","n":"Palazzina dell'Indiano (PIA)","g":"Palazzina dell'Indiano Arte _ PIA","z":"Cascine","t":"indipendente","p":"In fondo al Parco delle Cascine, sotto il ponte all'Indiano: treni che passano, aerei in atterraggio, il Mugnone che entra nell'Arno. Spazio per l'arte e caffè.","u":"https://www.google.com/maps/place/Palazzina+dell'Indiano+Arte+_+PIA/data=!4m2!3m1!1s0x132a5722f6c3e36d:0x5fc694f64d53eea9"},{"id":"77cf694358c83202","n":"Circolo Vie Nuove","g":"Circolo Ricreativo Culturale Vie Nuove","z":"Gavinana","t":"circolo","p":"Grande circolo ricreativo e culturale di Gavinana: sale, bar, attività per tutte le età. La socialità di quartiere come suono continuo.","u":"https://www.google.com/maps/place/Circolo+Ricreativo+Culturale+Vie+Nuove/data=!4m2!3m1!1s0x132a53891d59fd3f:0x77cf694358c83202"},{"id":"991c1f7454f5c2d8","n":"Exfila","g":"Exfila","z":"Gignoro","t":"circolo","p":"Spazio di quartiere dietro il Gignoro gestito da una cooperativa sociale: loggia all'aperto, sale al piano terra, al primo piano una sala con palco e impianto.","u":"https://www.google.com/maps/place/Exfila/data=!4m2!3m1!1s0x132a54875f0e7875:0x991c1f7454f5c2d8"},{"id":"2bacfa260ab48cf8","n":"L'appartamento","g":"L'appartamento","z":"Centro","t":"indipendente","p":"Associazione culturale al primo piano di un palazzo storico in via de' Giraldi: sembra davvero una casa. Musica, danza e laboratori in stanze domestiche, con una piccola terrazza coperta.","u":"https://www.google.com/maps/place/L'appartamento/data=!4m2!3m1!1s0x132a5406ba8b0155:0x2bacfa260ab48cf8"},{"id":"d08e0f2b45e6cf33","n":"Biblioteca Palagio di Parte Guelfa","g":"Biblioteca Palagio di Parte Guelfa","z":"Centro","t":"biblioteca","p":"Biblioteca comunale nel palazzo medievale della Parte Guelfa, a pochi passi dal Mercato Nuovo. Il silenzio di una lettura a cento metri dalla folla.","u":"https://www.google.com/maps/place/Biblioteca+Palagio+di+Parte+Guelfa/data=!4m2!3m1!1s0x132a540034242a63:0xd08e0f2b45e6cf33"},{"id":"e6593deb99c411f5","n":"Avamposto Cinque Punte","g":"Avamposto - Cinque Punte","z":"San Frediano","t":"indipendente","p":"Associazione in Borgo San Frediano per il fantasy, il gioco e l'arte: mostre, laboratori, giochi di ruolo. Mondi inventati raccontati ad alta voce.","u":"https://www.google.com/maps/place/Avamposto+-+Cinque+Punte/data=!4m2!3m1!1s0x132a574350bf5a53:0xe6593deb99c411f5"},{"id":"c5b5adbd6e42e4e3","n":"Ex Officine Galileo","g":"Ex Officine meccanotessile Galileo","z":"Rifredi","t":"infrastruttura","p":"L'area delle storiche officine di Rifredi, dove si costruivano strumenti ottici e macchine tessili. Volumi industriali in trasformazione.","u":"https://www.google.com/maps/place/Ex+Officine+meccanotessile+Galileo/data=!4m2!3m1!1s0x132a57fb0c6186e5:0xc5b5adbd6e42e4e3"},{"id":"401b613304666d3a","n":"Ex Spedale di San Piero, via Romana","g":"Via Romana, 64 R","z":"Porta Romana","t":"civico","p":"Un ex spedale su via Romana, la strada dei pellegrini diretti a Roma lungo la quale sorgevano piccoli ospizi.","u":"https://www.google.com/maps/place/Via+Romana,+64+R/data=!4m2!3m1!1s0x132a5153e34ec3a1:0x401b613304666d3a"},{"id":"283ae7d08669bf29","n":"Atallier","g":"Atallier","z":"Santo Spirito","t":"indipendente","p":"Laboratorio creativo di ceramica e arti in via de' Coverelli. Argilla, tornio, forno: il suono del fare con le mani, insieme.","u":"https://www.google.com/maps/place/Atallier/data=!4m2!3m1!1s0x132a51b0560da191:0x283ae7d08669bf29"},{"id":"32b9839f15c8c05f","n":"L'ornitorinco","g":"L'ornitorinco","z":"San Frediano","t":"commercio","p":"Libreria con caffè in via di Camaldoli, per adulti e bambini. Una stanza calma dove si legge e si studia.","u":"https://www.google.com/maps/place/L'ornitorinco/data=!4m2!3m1!1s0x132a51702359b6a3:0x32b9839f15c8c05f"},{"id":"bc306f9c3657c839","n":"Tempo Reale","g":"Tempo Reale, centro di ricerca produzione e didattica musicale","z":"Villa Strozzi","t":"formazione","p":"Il centro di ricerca e produzione musicale fondato da Luciano Berio, a Villa Strozzi. La casa della musica elettronica a Firenze, che ha già composto la città con le sue registrazioni.","u":"https://www.google.com/maps/place/Tempo+Reale,+centro+di+ricerca+produzione+e+didattica+musicale/data=!4m2!3m1!1s0x132a56b57f1b57e1:0xbc306f9c3657c839"},{"id":"c207d5ae1ebae227","n":"Combo Social Club","g":"Combo Social Club","z":"Campo di Marte","t":"indipendente","p":"Locale per concerti ed eventi in via Mannelli, lungo la ferrovia. Generi diversi, un pubblico di quartiere, i treni dall'altra parte del muro.","u":"https://www.google.com/maps/place/Combo+Social+Club/data=!4m2!3m1!1s0x132a547217dac9fd:0xc207d5ae1ebae227"},{"id":"ab8df587af8b9a72","n":"Murate Art District","g":"Murate Art District","z":"Sant'Ambrogio","t":"museo","p":"Centro per l'arte contemporanea nelle ex celle del carcere delle Murate. Stanze misurate per isolare, oggi aperte.","u":"https://www.google.com/maps/place/Murate+Art+District/data=!4m2!3m1!1s0x132a5574dec7a449:0xab8df587af8b9a72"},{"id":"66246031a81704e7","n":"gattaccio.","g":"gattaccio.","z":"Sant'Ambrogio","t":"commercio","p":"Libri, riviste e vinili in piazza Ghiberti, davanti al mercato di Sant'Ambrogio. Un posto piccolo dove const N = PLACES.length;
const WORDS = [[0, "quasi impossibile"], [20, "difficile"], [40, "si può provare"], [60, "abbordabile"], [80, "facile"], [95, "già nostro"]];
const word = v => WORDS.filter(w => v >= w[0]).pop()[1];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
const slug = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "anon";

// colour between stone (hard) and ochre (easy)
function mixColor(v) {
  const cs = getComputedStyle(document.documentElement);
  const a = hex(cs.getPropertyValue("--hard")), b = hex(cs.getPropertyValue("--easy")), t = v / 100;
  return `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(",")})`;
}
function hex(h) { h = h.trim().replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }

let who = ls("fsa.cursori.who") || "";
let votes = {};          // id -> {pid, who, v}

/* ---------- build ---------- */
const main = document.getElementById("main");
main.insertAdjacentHTML("beforeend", PLACES.map((p, i) => `
<section class="card unset" id="c-${p.id}" data-pid="${p.id}" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(p.n)}: quanto è facile averlo come partner">
  <div class="fill"></div><div class="group" hidden><b></b></div><div class="edge"></div>
  <div class="inner">
    <div class="top"><span>${i + 1} di ${N} <span class="saved">salvato</span></span></div>
    <div class="title"><h2>${esc(p.n)}</h2><div class="z">${esc(p.z)}${p.t ? ", " + esc(p.t) : ""}</div>${p.p ? `<p>${esc(p.p)}</p>` : ""}<a href="${esc(p.u)}" target="_blank" rel="noopener">Google Maps</a></div>
    <div><div class="verdict">← trascina →</div><div class="ends"><span>difficile</span><span>facile</span></div></div>
  </div>
</section>`).join("") + `<section class="rank" id="rank"></section>`);

/* ---------- card visuals ---------- */
function myVote(pid) { const d = votes[pid + "~" + slug(who)]; return d && typeof d.v === "number" ? d.v : null; }
function groupOf(pid) {
  const vs = Object.values(votes).filter(d => d && d.pid === pid && typeof d.v === "number");
  return vs.length ? {avg: Math.round(vs.reduce((a, d) => a + d.v, 0) / vs.length), n: vs.length} : null;
}
function paint(card, v) {
  const fill = card.querySelector(".fill"), edge = card.querySelector(".edge"), vd = card.querySelector(".verdict");
  if (v == null) { card.classList.add("unset"); vd.textContent = "← trascina →"; card.removeAttribute("aria-valuenow"); return; }
  card.classList.remove("unset");
  fill.style.width = v + "%"; fill.style.background = mixColor(v); edge.style.left = v + "%";
  vd.innerHTML = `${esc(word(v))}<small>${v}%</small>`;
  card.setAttribute("aria-valuenow", v); card.setAttribute("aria-valuetext", `${word(v)}, ${v} per cento`);
}
function paintGroup(card) {
  const g = groupOf(card.dataset.pid), el = card.querySelector(".group");
  if (!g || (g.n === 1 && myVote(card.dataset.pid) != null)) { el.hidden = true; return; }
  el.hidden = false; el.style.left = g.avg + "%";
  el.querySelector("b").textContent = `gruppo ${g.avg}% (${g.n})`;
}
function paintAll() {
  document.querySelectorAll(".card").forEach(c => { if (c !== dragCard) { paint(c, myVote(c.dataset.pid)); paintGroup(c); } });
  renderRank(); renderCount();
}

/* ---------- saving: Google Sheet via Apps Script ---------- */
const Q_KEY = "fsa.cursori.queue", CACHE_KEY = "fsa.cursori.cache";
let queue = []; try { queue = JSON.parse(ls(Q_KEY) || "[]"); } catch (e) { queue = []; }
let sheetUrl = "", sending = false, retryT = 0;
function persist() { ls(Q_KEY, JSON.stringify(queue)); }
function overlayQueue(base) {
  const o = Object.assign({}, base);
  queue.forEach(q => { o[q.pid + "~" + slug(q.who)] = {pid: q.pid, who: q.who, v: q.v}; });
  return o;
}
function fromServer(data) {
  if (!data || !data.ok || !Array.isArray(data.votes)) return false;
  const o = {};
  data.votes.forEach(d => { if (d && d.pid && typeof d.v === "number") o[d.pid + "~" + slug(d.who)] = {pid: d.pid, who: d.who, v: d.v}; });
  if (data.sheet) sheetUrl = data.sheet;
  ls(CACHE_KEY, JSON.stringify({votes: o, sheet: sheetUrl}));
  votes = overlayQueue(o);
  paintAll();
  return true;
}
async function save(pid, v) {
  if (!who) { askName(); return; }
  votes[pid + "~" + slug(who)] = {pid, who, v};
  renderRank(); renderCount(); paintGroup(document.getElementById("c-" + pid));
  queue = queue.filter(q => !(q.pid === pid && slug(q.who) === slug(who)));
  queue.push({pid, who, v});
  persist();
  if (!ENDPOINT) { flashSaved(pid); return; }
  send();
}
async function send() {
  if (sending || !queue.length || !ENDPOINT) return;
  sending = true; clearTimeout(retryT);
  while (queue.length) {
    const item = queue[0];
    try {
      const r = await fetch(ENDPOINT, {method: "POST", body: JSON.stringify(item)});
      const data = await r.json();
      if (data && data.error === "invalid") { queue.shift(); persist(); continue; }
      if (!data || !data.ok) throw new Error("server");
      queue = queue.filter(q => q !== item); persist();
      fromServer(data); flashSaved(item.pid);
    } catch (e) {
      toast("Voto non ancora inviato: riprovo tra poco.");
      retryT = setTimeout(send, 15000);
      break;
    }
  }
  sending = false;
}
async function refresh() {
  if (!ENDPOINT || dragCard || sending || queue.length || document.hidden) return;
  try { const r = await fetch(ENDPOINT + "?t=" + Date.now()); fromServer(await r.json()); } catch (e) {}
}
function flashSaved(pid) {
  const s = document.querySelector("#c-" + pid + " .saved"); if (!s) return;
  s.classList.add("on"); clearTimeout(s._t); s._t = setTimeout(() => s.classList.remove("on"), 1200);
}

/* ---------- gestures ---------- */
let dragCard = null, start = null, mode = null, cur = null, raf = 0, lastTick = -1;
function tick(v) { const t = Math.floor(v / 10); if (t !== lastTick) { lastTick = t; if (navigator.vibrate) navigator.vibrate(6); } }
document.addEventListener("pointerdown", e => {
  const card = e.target.closest(".card");
  if (!card || e.target.closest("a") || (e.pointerType === "mouse" && e.button !== 0)) return;
  dragCard = card; mode = null;
  const v0 = myVote(card.dataset.pid);
  start = {x: e.clientX, y: e.clientY, v: v0 == null ? 50 : v0, w: card.clientWidth, id: e.pointerId};
});
document.addEventListener("pointermove", e => {
  if (!dragCard || e.pointerId !== start.id) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  if (!mode) {
    if (Math.abs(dx) > 7 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      if (!who) { dragCard = null; askName(); return; }
      mode = "h"; try { dragCard.setPointerCapture(e.pointerId); } catch (_) {}
    } else if (Math.abs(dy) > 7) { mode = "v"; dragCard = null; return; }
    else return;
  }
  cur = clamp(start.v + dx / (start.w * 0.75) * 100);
  tick(cur);
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (dragCard) paint(dragCard, cur); });
});
function endDrag(e) {
  if (!dragCard || (e && e.pointerId !== start.id)) return;
  const card = dragCard; dragCard = null;
  if (mode === "h" && cur != null) { paint(card, cur); save(card.dataset.pid, cur); }
  mode = null; cur = null; lastTick = -1;
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", e => { if (dragCard && mode === "h") endDrag(e); else dragCard = null; });

// trackpad: two-finger sideways swipe
const wheelTimers = {};
document.addEventListener("wheel", e => {
  const card = e.target.closest(".card");
  if (!card || Math.abs(e.deltaX) <= Math.abs(e.deltaY) || Math.abs(e.deltaX) < 1) return;
  e.preventDefault();
  if (!who) { askName(); return; }
  const pid = card.dataset.pid, base = card._wv ?? myVote(pid) ?? 50;
  card._wv = clamp(base + e.deltaX / card.clientWidth * 60);
  tick(card._wv); paint(card, card._wv);
  clearTimeout(wheelTimers[pid]);
  wheelTimers[pid] = setTimeout(() => { save(pid, card._wv); card._wv = undefined; lastTick = -1; }, 350);
}, {passive: false});

// keyboard
document.addEventListener("keydown", e => {
  const card = e.target.closest && e.target.closest(".card");
  if (!card || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
  e.preventDefault();
  if (!who) { askName(); return; }
  const v = clamp((myVote(card.dataset.pid) ?? 50) + (e.key === "ArrowRight" ? 5 : -5));
  paint(card, v); save(card.dataset.pid, v);
});

/* ---------- name ---------- */
function askName() { document.getElementById("intro").scrollIntoView({behavior: "smooth"}); setTimeout(() => document.getElementById("nameInput").focus(), 400); toast("Prima scrivi il tuo nome"); }
document.getElementById("nameInput").value = who;
document.getElementById("nameForm").addEventListener("submit", e => {
  e.preventDefault();
  const n = document.getElementById("nameInput").value.trim().slice(0, 30);
  if (!n) return;
  who = n; ls("fsa.cursori.who", n); paintAll();
  document.getElementById("c-" + PLACES[0].id).scrollIntoView({behavior: "smooth"});
});

/* ---------- ranking ---------- */
function renderCount() {
  const c = document.getElementById("count");
  if (!who) { c.hidden = true; return; }
  const mine = PLACES.filter(p => myVote(p.id) != null).length;
  c.hidden = false; c.textContent = `${mine}/${N} ↓`;
}
document.getElementById("count").addEventListener("click", () => document.getElementById("rank").scrollIntoView({behavior: "smooth"}));
function renderRank() {
  const rows = PLACES.map(p => ({p, g: groupOf(p.id)}));
  const voted = rows.filter(r => r.g).sort((a, b) => b.g.avg - a.g.avg);
  const open = rows.filter(r => !r.g);
  const people = new Set(Object.values(votes).filter(d => d && typeof d.v === "number").map(d => slug(d.who))).size;
  const row = (r, i) => `<li><button type="button" data-go="${r.p.id}"><span class="n">${i + 1}</span>
    <span class="bar"><i style="width:${r.g.avg}%;background:${mixColor(r.g.avg)}"></i><span>${esc(r.p.n)}</span></span>
    <span class="pc">${r.g.avg}%<small>${r.g.n} ${r.g.n === 1 ? "voto" : "voti"}</small></span></button></li>`;
  document.getElementById("rank").innerHTML = `<h2>Classifica</h2>
    <p class="sub">${voted.length ? `Media di ${people} ${people === 1 ? "persona" : "persone"}. In alto i partner più facili, in fondo quelli da lasciar perdere.` : "Ancora nessun voto. Torna su e trascina."}</p>
    <ol>${voted.map(row).join("")}</ol>
    ${open.length ? `<h3>Ancora senza voti (${open.length})</h3><ol>${open.map(r => `<li><button type="button" data-go="${r.p.id}"><span class="n"></span><span class="bar"><span>${esc(r.p.n)}</span></span><span class="pc"></span></button></li>`).join("")}</ol>` : ""}
    ${sheetUrl ? `<a class="xl" href="${esc(sheetUrl)}" target="_blank" rel="noopener">Apri il foglio di valutazione</a>` : ""}`;
}
document.getElementById("main").addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) document.getElementById("c-" + g.dataset.go).scrollIntoView({behavior: "smooth"});
});

function toast(msg) {
  const t = document.createElement("div"); t.className = "note"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintAll);

/* ---------- start ---------- */
(function init() {
  try { const c = JSON.parse(ls(CACHE_KEY) || "{}"); votes = overlayQueue(c.votes || {}); sheetUrl = c.sheet || ""; } catch (e) { votes = overlayQueue({}); }
  if (!ENDPOINT) document.getElementById("trial").hidden = false;
  paintAll();
  if (ENDPOINT) {
    send(); refresh();
    setInterval(refresh, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { send(); refresh(); } });
    window.addEventListener("online", send);
  }
})();
</script>
</body>
