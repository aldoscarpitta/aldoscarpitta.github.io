<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Casale - Ricerca Intelligente</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Crimson Pro', serif;
            line-height: 1.7;
            color: #1a1a1a;
            background: #fafaf8;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 3px solid #1a1a1a;
        }
        
        .header h1 {
            font-size: 3.5em;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #666;
        }
        
        .status-bar {
            background: #1a1a1a;
            color: white;
            padding: 15px 25px;
            margin-bottom: 30px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
        }
        
        .status-dot.loading {
            background: #ff9800;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .search-box {
            background: white;
            border: 3px solid #1a1a1a;
            padding: 35px;
            margin-bottom: 40px;
            box-shadow: 10px 10px 0 rgba(0,0,0,0.1);
        }
        
        .search-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        #questionInput {
            flex: 1;
            padding: 18px;
            font-family: 'Crimson Pro', serif;
            font-size: 1.1em;
            border: 2px solid #1a1a1a;
            background: #fafaf8;
        }
        
        #questionInput:focus {
            outline: none;
            background: white;
        }
        
        .search-btn {
            padding: 18px 40px;
            background: #1a1a1a;
            color: white;
            border: none;
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }
        
        .search-btn:hover:not(:disabled) {
            background: #333;
        }
        
        .search-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .example-tag {
            padding: 8px 16px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .example-tag:hover {
            background: #1a1a1a;
            color: white;
        }
        
        .results-container {
            min-height: 200px;
        }
        
        .quick-answer {
            background: #e8f5e9;
            border: 3px solid #4caf50;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 8px 8px 0 rgba(76, 175, 80, 0.1);
        }
        
        .quick-answer-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            font-weight: 700;
            color: #2e7d32;
        }
        
        .quick-answer-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #4caf50;
            font-size: 1.1em;
            line-height: 1.8;
        }
        
        .quick-answer-item strong {
            color: #2e7d32;
            font-weight: 700;
        }
        
        .quick-answer-source {
            margin-top: 10px;
            font-size: 0.85em;
            color: #666;
            font-style: italic;
        }
        
        .detailed-results {
            margin-top: 40px;
        }
        
        .detailed-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 25px;
            font-weight: 700;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        
        .result-card {
            background: white;
            border: 2px solid #1a1a1a;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.05);
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        
        .result-section {
            font-family: 'Space Mono', monospace;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }
        
        .result-meta {
            text-align: right;
            font-size: 0.85em;
        }
        
        .result-doc {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .result-year {
            color: #666;
            font-family: 'Space Mono', monospace;
        }
        
        .result-content {
            font-size: 1.05em;
            line-height: 1.9;
            margin-bottom: 20px;
        }
        
        .highlight {
            background: linear-gradient(120deg, #fff59d 0%, #fff176 100%);
            padding: 2px 5px;
            font-weight: 600;
            border-radius: 2px;
        }
        
        .result-link {
            display: inline-block;
            padding: 10px 20px;
            background: #fafaf8;
            border: 2px solid #1a1a1a;
            text-decoration: none;
            color: #1a1a1a;
            font-family: 'Space Mono', monospace;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s;
        }
        
        .result-link:hover {
            background: #1a1a1a;
            color: white;
        }
        
        .no-results {
            text-align: center;
            padding: 80px 30px;
            background: white;
            border: 2px dashed #ccc;
        }
        
        .no-results-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .no-results h3 {
            font-size: 2em;
            margin-bottom: 15px;
        }
        
        .welcome {
            text-align: center;
            padding: 60px 30px;
            background: white;
            border: 2px dashed #ddd;
        }
        
        .welcome h2 {
            font-size: 2em;
            margin-bottom: 15px;
        }
        
        .welcome p {
            font-size: 1.1em;
            color: #666;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5em;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .result-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .result-meta {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 Il Casale</h1>
            <div class="subtitle">Ricerca Intelligente Documenti</div>
        </div>
        
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot loading" id="statusDot"></div>
                <span id="statusText">Caricamento...</span>
            </div>
            <div id="statsText">---</div>
        </div>
        
        <div class="search-box">
            <div class="search-label">Cerca informazioni</div>
            <div class="input-group">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Es: Quanto costa il biglietto? Chi si occupa dei bandi?"
                    disabled
                >
                <button class="search-btn" id="searchBtn" onclick="search()" disabled>
                    Cerca
                </button>
            </div>
            <div class="examples">
                <span class="example-tag" onclick="searchExample('prezzo biglietto')">Prezzi</span>
                <span class="example-tag" onclick="searchExample('chi si occupa bandi')">Bandi</span>
                <span class="example-tag" onclick="searchExample('date festival 2025')">Date 2025</span>
                <span class="example-tag" onclick="searchExample('budget')">Budget</span>
                <span class="example-tag" onclick="searchExample('4ever punk')">4ever Punk</span>
                <span class="example-tag" onclick="searchExample('affitto casale')">Affitto</span>
                <span class="example-tag" onclick="searchExample('volontari')">Volontari</span>
            </div>
        </div>
        
        <div class="results-container" id="resultsContainer">
            <div class="welcome">
                <h2>👋 Benvenuto</h2>
                <p>Cerca informazioni nei documenti del Casale</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbydDRedibh1pI3_4xunYzMpjw3kkef_FdHxx8x-atHr2wEtRnsZ0mmwjberyF06I6c9/exec';
        
        // ============================================
        // STATE
        // ============================================
        
        let database = null;
        let isSearching = false;
        let isReady = false;
        
        // ============================================
        // INITIALIZATION
        // ============================================
        
        async function init() {
            updateStatus('loading', 'Caricamento...');
            
            if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                updateStatus('error', 'Non configurato');
                showError('Configurazione necessaria', 'Inserisci l\'URL del Google Apps Script.');
                return;
            }
            
            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error('Errore');
                
                database = await response.json();
                
                updateStatus('ready', 'Pronto');
                document.getElementById('statsText').textContent = 
                    `${database.totalDocuments} documenti • ${database.approximateWords.toLocaleString()} parole`;
                
                document.getElementById('questionInput').disabled = false;
                document.getElementById('searchBtn').disabled = false;
                isReady = true;
                
            } catch (error) {
                console.error('Init error:', error);
                updateStatus('error', 'Errore');
                showError('Errore connessione', 'Verifica la configurazione.');
            }
        }
        
        function updateStatus(state, text) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            dot.className = `status-dot ${state}`;
            statusText.textContent = text;
        }
        
        // ============================================
        // SEARCH
        // ============================================
        
        document.getElementById('questionInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && isReady && !isSearching) {
                search();
            }
        });
        
        function searchExample(query) {
            document.getElementById('questionInput').value = query;
            search();
        }
        
        function search() {
            if (!isReady || isSearching) return;
            
            const query = document.getElementById('questionInput').value.trim();
            if (!query) {
                alert('Inserisci una domanda');
                return;
            }
            
            isSearching = true;
            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = 'Ricerca...';
            
            // Perform intelligent search
            const results = performIntelligentSearch(query);
            
            // Display results
            displaySmartResults(results, query);
            
            isSearching = false;
            btn.disabled = false;
            btn.textContent = 'Cerca';
        }
        
        function performIntelligentSearch(query) {
            const keywords = extractKeywords(query);
            const results = [];
            
            database.documents.forEach(doc => {
                if (doc.sections && doc.sections.length > 0) {
                    doc.sections.forEach(section => {
                        const analysis = analyzeSection(section, keywords, query);
                        
                        if (analysis.score > 0) {
                            results.push({
                                docName: doc.name,
                                docUrl: doc.url,
                                year: doc.year,
                                sectionTitle: section.title,
                                content: section.content,
                                score: analysis.score,
                                relevantParts: analysis.relevantParts,
                                context: analysis.context
                            });
                        }
                    });
                }
            });
            
            // Sort by relevance
            results.sort((a, b) => b.score - a.score);
            
            return results;
        }
        
        function extractKeywords(query) {
            // Remove question words
            const stopWords = ['quanto', 'come', 'quando', 'dove', 'chi', 'cosa', 'che', 'quale', 
                               'costa', 'sono', 'si', 'la', 'il', 'del', 'della', 'per', 'con', 'da'];
            
            return query.toLowerCase()
                .split(/\s+/)
                .filter(word => word.length > 2 && !stopWords.includes(word));
        }
        
        function analyzeSection(section, keywords, originalQuery) {
            const sectionText = (section.title + ' ' + section.content).toLowerCase();
            let score = 0;
            let relevantParts = [];
            
            // Check for exact phrase match
            if (sectionText.includes(originalQuery.toLowerCase())) {
                score += 100;
            }
            
            // Check title matches (worth more)
            keywords.forEach(keyword => {
                if (section.title.toLowerCase().includes(keyword)) {
                    score += 50;
                }
            });
            
            // Check content matches and extract context
            keywords.forEach(keyword => {
                const regex = new RegExp(keyword, 'gi');
                const matches = sectionText.match(regex);
                if (matches) {
                    score += matches.length * 10;
                    
                    // Extract sentences containing the keyword
                    const sentences = section.content.split(/[.!?]+/);
                    sentences.forEach(sentence => {
                        if (sentence.toLowerCase().includes(keyword)) {
                            relevantParts.push(sentence.trim());
                        }
                    });
                }
            });
            
            // Get context (surrounding sentences)
            const context = extractContext(section.content, keywords);
            
            return { score, relevantParts, context };
        }
        
        function extractContext(content, keywords) {
            const sentences = content.split(/[.!?]+/).map(s => s.trim()).filter(s => s.length > 0);
            const relevantSentences = [];
            
            sentences.forEach((sentence, index) => {
                const hasKeyword = keywords.some(kw => sentence.toLowerCase().includes(kw));
                if (hasKeyword) {
                    // Include this sentence and neighbors for context
                    const start = Math.max(0, index - 1);
                    const end = Math.min(sentences.length, index + 2);
                    for (let i = start; i < end; i++) {
                        if (!relevantSentences.includes(sentences[i])) {
                            relevantSentences.push(sentences[i]);
                        }
                    }
                }
            });
            
            return relevantSentences.join('. ') + '.';
        }
        
        // ============================================
        // DISPLAY
        // ============================================
        
        function displaySmartResults(results, query) {
            const container = document.getElementById('resultsContainer');
            
            if (results.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <h3>Nessun risultato</h3>
                        <p>Prova con parole diverse o clicca su un esempio</p>
                    </div>
                `;
                return;
            }
            
            // Build quick answer from top results
            const quickAnswerHTML = buildQuickAnswer(results.slice(0, 3), query);
            
            // Build detailed results
            const detailedHTML = buildDetailedResults(results.slice(0, 8), query);
            
            container.innerHTML = `
                ${quickAnswerHTML}
                ${detailedHTML}
            `;
        }
        
        function buildQuickAnswer(topResults, query) {
            const keywords = extractKeywords(query);
            
            const items = topResults.map(result => {
                let context = result.context || result.content.substring(0, 300);
                
                // Highlight keywords
                keywords.forEach(kw => {
                    const regex = new RegExp(`(${kw})`, 'gi');
                    context = context.replace(regex, '<span class="highlight">$1</span>');
                });
                
                return `
                    <div class="quick-answer-item">
                        ${context}
                        <div class="quick-answer-source">
                            — ${result.sectionTitle}, ${result.docName} (${result.year})
                        </div>
                    </div>
                `;
            }).join('');
            
            return `
                <div class="quick-answer">
                    <div class="quick-answer-title">✨ Risposta Rapida</div>
                    ${items}
                </div>
            `;
        }
        
        function buildDetailedResults(results, query) {
            const keywords = extractKeywords(query);
            
            const cards = results.map(result => {
                let content = result.context || result.content.substring(0, 400);
                
                // Highlight keywords
                keywords.forEach(kw => {
                    const regex = new RegExp(`(${kw})`, 'gi');
                    content = content.replace(regex, '<span class="highlight">$1</span>');
                });
                
                return `
                    <div class="result-card">
                        <div class="result-header">
                            <div class="result-section">${result.sectionTitle}</div>
                            <div class="result-meta">
                                <div class="result-doc">${result.docName}</div>
                                <div class="result-year">📅 ${result.year}</div>
                            </div>
                        </div>
                        <div class="result-content">${content}${content.length >= 400 ? '...' : ''}</div>
                        <a href="${result.docUrl}" target="_blank" class="result-link">
                            📄 Vedi documento completo
                        </a>
                    </div>
                `;
            }).join('');
            
            return `
                <div class="detailed-results">
                    <div class="detailed-title">📚 Tutte le informazioni trovate</div>
                    ${cards}
                </div>
            `;
        }
        
        function showError(title, message) {
            document.getElementById('resultsContainer').innerHTML = `
                <div class="no-results">
                    <div class="no-results-icon">⚠️</div>
                    <h3>${title}</h3>
                    <p>${message}</p>
                </div>
            `;
        }
        
        // ============================================
        // START
        // ============================================
        
        window.addEventListener('load', init);
    </script>
</body>
</html>
