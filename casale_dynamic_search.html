<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Casale - Ricerca Intelligente</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Crimson Pro', serif;
            line-height: 1.7;
            color: #1a1a1a;
            background: #fafaf8;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 3px solid #1a1a1a;
        }
        
        .header img {
            max-width: 250px;
            height: auto;
            margin-bottom: 25px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        
        .header h1 {
            font-size: 3.5em;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #666;
        }
        
        .status-bar {
            background: #1a1a1a;
            color: white;
            padding: 15px 25px;
            margin-bottom: 30px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
        }
        
        .status-dot.loading {
            background: #ff9800;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(250, 250, 248, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading-content {
            text-align: center;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #eee;
            border-top: 4px solid #1a1a1a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-family: 'Space Mono', monospace;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #1a1a1a;
        }
        
        .search-box {
            background: white;
            border: 3px solid #1a1a1a;
            padding: 35px;
            margin-bottom: 40px;
            box-shadow: 10px 10px 0 rgba(0,0,0,0.1);
        }
        
        .search-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        #questionInput {
            flex: 1;
            padding: 18px;
            font-family: 'Crimson Pro', serif;
            font-size: 1.1em;
            border: 2px solid #1a1a1a;
            background: #fafaf8;
        }
        
        #questionInput:focus {
            outline: none;
            background: white;
        }
        
        .search-btn {
            padding: 18px 40px;
            background: #1a1a1a;
            color: white;
            border: none;
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }
        
        .search-btn:hover:not(:disabled) {
            background: #333;
        }
        
        .search-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .example-tag {
            padding: 8px 16px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .example-tag:hover {
            background: #1a1a1a;
            color: white;
        }
        
        .results-container {
            min-height: 200px;
        }
        
        .folder-links {
            background: #fff3e0;
            border: 3px solid #ff9800;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 8px 8px 0 rgba(255, 152, 0, 0.1);
        }
        
        .folder-links-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 15px;
            font-weight: 700;
            color: #e65100;
        }
        
        .folder-link {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            background: white;
            border: 2px solid #ff9800;
            text-decoration: none;
            color: #e65100;
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .folder-link:hover {
            background: #ff9800;
            color: white;
        }
        
        .quick-answer {
            background: #e8f5e9;
            border: 3px solid #4caf50;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 8px 8px 0 rgba(76, 175, 80, 0.1);
        }
        
        .quick-answer-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            font-weight: 700;
            color: #2e7d32;
        }
        
        .quick-answer-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #4caf50;
            font-size: 1.05em;
            line-height: 1.9;
        }
        
        .quick-answer-item strong {
            color: #2e7d32;
            font-weight: 700;
        }
        
        .quick-answer-item p {
            margin-bottom: 0.8em;
        }
        
        .quick-answer-item p:last-child {
            margin-bottom: 0;
        }
        
        .quick-answer-item ul, .quick-answer-item ol {
            margin: 0.8em 0;
            padding-left: 25px;
        }
        
        .quick-answer-item li {
            margin-bottom: 0.5em;
        }
        
        .quick-answer-source {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.85em;
            color: #666;
            font-style: italic;
        }
        
        .detailed-results {
            margin-top: 40px;
        }
        
        .detailed-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 25px;
            font-weight: 700;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        
        .result-card {
            background: white;
            border: 2px solid #1a1a1a;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.05);
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        
        .result-section {
            font-family: 'Space Mono', monospace;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }
        
        .result-meta {
            text-align: right;
            font-size: 0.85em;
        }
        
        .result-doc {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .result-year {
            color: #666;
            font-family: 'Space Mono', monospace;
        }
        
        .result-content {
            font-size: 1.05em;
            line-height: 1.9;
            margin-bottom: 20px;
        }
        
        .result-content p {
            margin-bottom: 1em;
        }
        
        .result-content ul, .result-content ol {
            margin: 1em 0;
            padding-left: 25px;
        }
        
        .result-content li {
            margin-bottom: 0.6em;
        }
        
        .highlight {
            background: linear-gradient(120deg, #fff59d 0%, #fff176 100%);
            padding: 2px 5px;
            font-weight: 600;
            border-radius: 2px;
        }
        
        .result-link {
            display: inline-block;
            padding: 10px 20px;
            background: #fafaf8;
            border: 2px solid #1a1a1a;
            text-decoration: none;
            color: #1a1a1a;
            font-family: 'Space Mono', monospace;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s;
        }
        
        .result-link:hover {
            background: #1a1a1a;
            color: white;
        }
        
        .no-results {
            text-align: center;
            padding: 80px 30px;
            background: white;
            border: 2px dashed #ccc;
        }
        
        .no-results-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .no-results h3 {
            font-size: 2em;
            margin-bottom: 15px;
        }
        
        .welcome {
            text-align: center;
            padding: 60px 30px;
            background: white;
            border: 2px dashed #ddd;
        }
        
        .welcome h2 {
            font-size: 2em;
            margin-bottom: 15px;
        }
        
        .welcome p {
            font-size: 1.1em;
            color: #666;
            line-height: 1.6;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5em;
            }
            
            .header img {
                max-width: 180px;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .result-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .result-meta {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">Caricamento documenti...</div>
        </div>
    </div>
    
    <div class="container">
        <div class="header">
            <img src="logocasale.png" alt="Il Casale">
            <div class="subtitle">Ricerca Intelligente Documenti</div>
        </div>
        
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Pronto</span>
            </div>
            <div id="statsText">---</div>
        </div>
        
        <div class="search-box">
            <div class="search-label">Cerca per parole chiave</div>
            <div class="input-group">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Es: prezzi, bandi, volontari, 4ever punk, budget..."
                    disabled
                >
                <button class="search-btn" id="searchBtn" onclick="search()" disabled>
                    Cerca
                </button>
            </div>
            <div class="examples">
                <span class="example-tag" onclick="searchExample('prezzi biglietti')">Prezzi</span>
                <span class="example-tag" onclick="searchExample('bandi')">Bandi</span>
                <span class="example-tag" onclick="searchExample('festival 2025')">Festival 2025</span>
                <span class="example-tag" onclick="searchExample('budget')">Budget</span>
                <span class="example-tag" onclick="searchExample('4ever punk')">4ever Punk</span>
                <span class="example-tag" onclick="searchExample('volontari')">Volontari</span>
                <span class="example-tag" onclick="searchExample('affitto casale')">Affitto</span>
            </div>
        </div>
        
        <div class="results-container" id="resultsContainer">
            <div class="welcome">
                <h2>👋 Benvenuto</h2>
                <p>Usa parole chiave per cercare informazioni nei documenti del Casale</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        
        const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
        const CACHE_DURATION = 30 * 60 * 1000; // 30 minutes
        
        // Folder mapping for direct links
        const FOLDER_MAPPING = {
            'report': { id: '1Od2ExcFCiCVsU3R2zxhhLljiorZXNzvc', name: 'Report e Riunioni' },
            'riunione': { id: '1Od2ExcFCiCVsU3R2zxhhLljiorZXNzvc', name: 'Report e Riunioni' },
            'riunioni': { id: '1Od2ExcFCiCVsU3R2zxhhLljiorZXNzvc', name: 'Report e Riunioni' },
            'assemblea': { id: '1Od2ExcFCiCVsU3R2zxhhLljiorZXNzvc', name: 'Report e Riunioni' },
            'verbale': { id: '1Od2ExcFCiCVsU3R2zxhhLljiorZXNzvc', name: 'Report e Riunioni' },
            'verbali': { id: '1Od2ExcFCiCVsU3R2zxhhLljiorZXNzvc', name: 'Report e Riunioni' },
            'festival': { id: '1gN63vet7MGU_UVa6Ygwkd_DM5QxmhwCR', name: 'Festival e Organizzazione' },
            'organizzazione': { id: '1gN63vet7MGU_UVa6Ygwkd_DM5QxmhwCR', name: 'Festival e Organizzazione' },
            'programmazione': { id: '1gN63vet7MGU_UVa6Ygwkd_DM5QxmhwCR', name: 'Festival e Organizzazione' },
            'palchi': { id: '1gN63vet7MGU_UVa6Ygwkd_DM5QxmhwCR', name: 'Festival e Organizzazione' },
            'allestimenti': { id: '1gN63vet7MGU_UVa6Ygwkd_DM5QxmhwCR', name: 'Festival e Organizzazione' },
            'logistica': { id: '1gN63vet7MGU_UVa6Ygwkd_DM5QxmhwCR', name: 'Festival e Organizzazione' }
        };
        
        // ============================================
        // STATE
        // ============================================
        
        let database = null;
        let isSearching = false;
        let isReady = false;
        
        // ============================================
        // INITIALIZATION
        // ============================================
        
        async function init() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            updateStatus('loading', 'Caricamento...');
            
            if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                loadingOverlay.style.display = 'none';
                updateStatus('error', 'Non configurato');
                showError('Configurazione necessaria', 'Inserisci l\'URL del Google Apps Script.');
                return;
            }
            
            try {
                const cachedData = loadFromCache();
                
                if (cachedData) {
                    console.log('✓ Loaded from browser cache');
                    database = cachedData;
                    finishInit();
                    loadingOverlay.style.display = 'none';
                    
                    fetchFreshData().then(freshData => {
                        if (freshData) {
                            database = freshData;
                            saveToCache(freshData);
                        }
                    });
                } else {
                    console.log('✗ No cache, fetching fresh data');
                    const freshData = await fetchFreshData();
                    
                    if (freshData) {
                        database = freshData;
                        saveToCache(freshData);
                        finishInit();
                    } else {
                        throw new Error('No data');
                    }
                    
                    loadingOverlay.style.display = 'none';
                }
                
            } catch (error) {
                console.error('Init error:', error);
                loadingOverlay.style.display = 'none';
                updateStatus('error', 'Errore');
                showError('Errore connessione', 'Verifica la configurazione.');
            }
        }
        
        async function fetchFreshData() {
            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error('Fetch error');
                return await response.json();
            } catch (error) {
                console.error('Fetch error:', error);
                return null;
            }
        }
        
        function finishInit() {
            updateStatus('ready', 'Pronto');
            document.getElementById('statsText').textContent = 
                `${database.totalDocuments} documenti • ${database.approximateWords.toLocaleString()} parole`;
            
            document.getElementById('questionInput').disabled = false;
            document.getElementById('searchBtn').disabled = false;
            isReady = true;
        }
        
        function saveToCache(data) {
            try {
                const cacheData = {
                    timestamp: Date.now(),
                    data: data
                };
                localStorage.setItem('casale_documents_cache', JSON.stringify(cacheData));
                console.log('✓ Saved to browser cache');
            } catch (error) {
                console.error('Cache save error:', error);
            }
        }
        
        function loadFromCache() {
            try {
                const cached = localStorage.getItem('casale_documents_cache');
                if (!cached) return null;
                
                const cacheData = JSON.parse(cached);
                const age = Date.now() - cacheData.timestamp;
                
                if (age < CACHE_DURATION) {
                    return cacheData.data;
                } else {
                    localStorage.removeItem('casale_documents_cache');
                    return null;
                }
            } catch (error) {
                console.error('Cache load error:', error);
                return null;
            }
        }
        
        function updateStatus(state, text) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            dot.className = `status-dot ${state}`;
            statusText.textContent = text;
        }
        
        // ============================================
        // FOLDER LINKS
        // ============================================
        
        function findRelevantFolders(query) {
            const keywords = query.toLowerCase().split(/\s+/);
            const folders = new Set();
            
            keywords.forEach(keyword => {
                if (FOLDER_MAPPING[keyword]) {
                    folders.add(FOLDER_MAPPING[keyword]);
                }
            });
            
            return Array.from(folders);
        }
        
        function buildFolderLinksHTML(folders) {
            if (folders.length === 0) return '';
            
            const links = folders.map(folder => `
                <a href="https://drive.google.com/drive/folders/${folder.id}" 
                   target="_blank" 
                   class="folder-link">
                    📁 ${folder.name}
                </a>
            `).join('');
            
            return `
                <div class="folder-links">
                    <div class="folder-links-title">📂 Cartelle correlate su Google Drive</div>
                    ${links}
                </div>
            `;
        }
        
        // ============================================
        // SEARCH
        // ============================================
        
        document.getElementById('questionInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && isReady && !isSearching) {
                search();
            }
        });
        
        function searchExample(query) {
            document.getElementById('questionInput').value = query;
            search();
        }
        
        function search() {
            if (!isReady || isSearching) return;
            
            const query = document.getElementById('questionInput').value.trim();
            if (!query) {
                alert('Inserisci una parola chiave');
                return;
            }
            
            isSearching = true;
            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = 'Ricerca...';
            
            const results = performIntelligentSearch(query);
            displaySmartResults(results, query);
            
            isSearching = false;
            btn.disabled = false;
            btn.textContent = 'Cerca';
        }
        
        function performIntelligentSearch(query) {
            const keywords = extractKeywords(query);
            const results = [];
            
            database.documents.forEach(doc => {
                if (doc.sections && doc.sections.length > 0) {
                    doc.sections.forEach(section => {
                        const analysis = analyzeSection(section, keywords, query);
                        
                        if (analysis.score > 0) {
                            results.push({
                                docName: doc.name,
                                docUrl: doc.url,
                                year: doc.year,
                                sectionTitle: section.title,
                                content: section.content,
                                score: analysis.score,
                                context: analysis.context
                            });
                        }
                    });
                }
            });
            
            results.sort((a, b) => b.score - a.score);
            return results;
        }
        
        function extractKeywords(query) {
            const stopWords = ['quanto', 'come', 'quando', 'dove', 'chi', 'cosa', 'che', 'quale', 
                               'costa', 'sono', 'si', 'la', 'il', 'del', 'della', 'per', 'con', 'da'];
            
            return query.toLowerCase()
                .split(/\s+/)
                .filter(word => word.length > 2 && !stopWords.includes(word));
        }
        
        function analyzeSection(section, keywords, originalQuery) {
            const sectionText = (section.title + ' ' + section.content).toLowerCase();
            let score = 0;
            
            if (sectionText.includes(originalQuery.toLowerCase())) {
                score += 100;
            }
            
            keywords.forEach(keyword => {
                if (section.title.toLowerCase().includes(keyword)) {
                    score += 50;
                }
                
                const matches = (sectionText.match(new RegExp(keyword, 'gi')) || []).length;
                score += matches * 10;
            });
            
            const context = extractContext(section.content, keywords);
            
            return { score, context };
        }
        
        function extractContext(content, keywords) {
            const sentences = content.split(/[.!?]+/).map(s => s.trim()).filter(s => s.length > 0);
            const relevantSentences = [];
            
            sentences.forEach((sentence, index) => {
                const hasKeyword = keywords.some(kw => sentence.toLowerCase().includes(kw));
                if (hasKeyword) {
                    const start = Math.max(0, index - 1);
                    const end = Math.min(sentences.length, index + 2);
                    for (let i = start; i < end; i++) {
                        if (!relevantSentences.includes(sentences[i])) {
                            relevantSentences.push(sentences[i]);
                        }
                    }
                }
            });
            
            return relevantSentences.join('. ') + '.';
        }
        
        // ============================================
        // DISPLAY
        // ============================================
        
        function formatTextWithStructure(text) {
            let formatted = text
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);
            
            let html = '';
            let inList = false;
            
            formatted.forEach(line => {
                if (line.match(/^[-•*]\s+/) || line.match(/^\d+\.\s+/)) {
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    const cleanLine = line.replace(/^[-•*]\s+/, '').replace(/^\d+\.\s+/, '');
                    html += `<li>${cleanLine}</li>`;
                } else {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    html += `<p>${line}</p>`;
                }
            });
            
            if (inList) {
                html += '</ul>';
            }
            
            return html || `<p>${text}</p>`;
        }
        
        function displaySmartResults(results, query) {
            const container = document.getElementById('resultsContainer');
            
            if (results.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <h3>Nessun risultato</h3>
                        <p>Prova con parole chiave diverse o clicca su un esempio</p>
                    </div>
                `;
                return;
            }
            
            // Check for relevant folders
            const folders = findRelevantFolders(query);
            const folderLinksHTML = buildFolderLinksHTML(folders);
            
            // Build results
            const quickAnswerHTML = buildQuickAnswer(results.slice(0, 3), query);
            const detailedHTML = buildDetailedResults(results.slice(0, 8), query);
            
            container.innerHTML = `
                ${folderLinksHTML}
                ${quickAnswerHTML}
                ${detailedHTML}
            `;
        }
        
        function buildQuickAnswer(topResults, query) {
            const keywords = extractKeywords(query);
            
            const items = topResults.map(result => {
                let context = result.context || result.content.substring(0, 500);
                let formattedContext = formatTextWithStructure(context);
                
                keywords.forEach(kw => {
                    const regex = new RegExp(`(${kw})`, 'gi');
                    formattedContext = formattedContext.replace(regex, '<span class="highlight">$1</span>');
                });
                
                return `
                    <div class="quick-answer-item">
                        ${formattedContext}
                        <div class="quick-answer-source">
                            — ${result.sectionTitle}, ${result.docName} (${result.year})
                        </div>
                    </div>
                `;
            }).join('');
            
            return `
                <div class="quick-answer">
                    <div class="quick-answer-title">✨ Risposta Rapida</div>
                    ${items}
                </div>
            `;
        }
        
        function buildDetailedResults(results, query) {
            const keywords = extractKeywords(query);
            
            const cards = results.map(result => {
                let content = result.context || result.content.substring(0, 600);
                let formattedContent = formatTextWithStructure(content);
                
                keywords.forEach(kw => {
                    const regex = new RegExp(`(${kw})`, 'gi');
                    formattedContent = formattedContent.replace(regex, '<span class="highlight">$1</span>');
                });
                
                return `
                    <div class="result-card">
                        <div class="result-header">
                            <div class="result-section">${result.sectionTitle}</div>
                            <div class="result-meta">
                                <div class="result-doc">${result.docName}</div>
                                <div class="result-year">📅 ${result.year}</div>
                            </div>
                        </div>
                        <div class="result-content">${formattedContent}</div>
                        <a href="${result.docUrl}" target="_blank" class="result-link">
                            📄 Vedi documento completo
                        </a>
                    </div>
                `;
            }).join('');
            
            return `
                <div class="detailed-results">
                    <div class="detailed-title">📚 Tutte le informazioni trovate</div>
                    ${cards}
                </div>
            `;
        }
        
        function showError(title, message) {
            document.getElementById('resultsContainer').innerHTML = `
                <div class="no-results">
                    <div class="no-results-icon">⚠️</div>
                    <h3>${title}</h3>
                    <p>${message}</p>
                </div>
            `;
        }
        
        // ============================================
        // START
        // ============================================
        
        window.addEventListener('load', init);
    </script>
</body>
</html>
